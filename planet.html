<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">HOME</a>
        <a href="compare.html">EARTH & MARS</a>
        <a href="planets.html" class="active">SOLAR SYSTEM</a>
    </nav>

    <h1 class="main-title">THE SOLAR SYSTEM</h1>
    <div class="planets-grid">
        <div class="planet-card" onclick="openDetails('The Sun', '0 km (The Center)')">
            <img src="https://images.unsplash.com/photo-1532692019777-17eb48b94f6c?w=400" alt="Sun">
            <h3>The Sun</h3>
        </div>
        <div class="planet-card" onclick="openDetails('Mercury', '57.9 Million km')">
            <img src="https://images.unsplash.com/photo-1614732414444-096e5f1122d5?w=400" alt="Mercury">
            <h3>Mercury</h3>
        </div>
        <div class="planet-card" onclick="openDetails('Venus', '108.2 Million km')">
            <img src="https://images.unsplash.com/photo-1614732484003-ef9881555dc3?w=400" alt="Venus">
            <h3>Venus</h3>
        </div>
        <div class="planet-card" onclick="openDetails('Earth', '149.6 Million km')">
            <img src="https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?w=400" alt="Earth">
            <h3>Earth</h3>
        </div>
        <div class="planet-card" onclick="openDetails('Mars', '227.9 Million km')">
            <img src="https://images.unsplash.com/photo-1614729939124-032f0b56c9ce?w=400" alt="Mars">
            <h3>Mars</h3>
        </div>
        <div class="planet-card" onclick="openDetails('Jupiter', '778.5 Million km')">
            <img src="https://images.unsplash.com/photo-1630839437035-dac17da580d0?w=400" alt="Jupiter">
            <h3>Jupiter</h3>
        </div>
        <div class="planet-card" onclick="openDetails('Saturn', '1.4 Billion km')">
            <img src="https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?w=400" style="filter: hue-rotate(200deg);" alt="Saturn">
            <h3>Saturn</h3>
        </div>
        <div class="planet-card" onclick="openDetails('Uranus', '2.9 Billion km')">
            <img src="https://images.unsplash.com/photo-1614732414444-096e5f1122d5?w=400" style="filter: hue-rotate(160deg);" alt="Uranus">
            <h3>Uranus</h3>
        </div>
        <div class="planet-card" onclick="openDetails('Neptune', '4.5 Billion km')">
            <img src="https://images.unsplash.com/photo-1614732414444-096e5f1122d5?w=400" style="filter: hue-rotate(220deg);" alt="Neptune">
            <h3>Neptune</h3>
        </div>
    </div>

    <div id="modal-bg" onclick="closeDetails()"></div>
    <div id="info-modal">
        <h2 id="planet-name-label"></h2>
        <p>Distance from Sun: <br><span id="planet-dist-label"></span></p>
        <button onclick="closeDetails()">CLOSE</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
